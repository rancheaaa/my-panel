# Agent Server Configuration
# ==========================

# The port number on which the agent server will listen for incoming connections.
# Default: 7777
server.port=

# Maximum number of port probe steps. If the configured port is occupied, the server will try to find an available port by incrementing.
# Set to 0 or negative to disable automatic port probing.
# Default: 10
server.port.probe.max.steps=

# A unique identifier for this agent. If left blank, a random UUID will be generated.
# This ID is useful for distinguishing agents in a distributed environment.
agent.id=

# The IP address for the agent server to bind to. Binds to all interfaces if empty.
# If left blank, the system will automatically detect the first non-loopback IP address.
agent.ip=

# Registry Server Configuration
# =============================

# The URL(s) of registry server(s) where the agent will register itself.
# Supports multiple registry servers separated by commas for high availability.
# Example 1 (single server): http://192.168.1.100:8080
# Example 2 (multiple servers): http://192.168.1.100:8080,http://192.168.1.101:8080,http://192.168.1.102:8080
# If left blank, auto-registration and heartbeat will be disabled.
# Default: "http://localhost:9876,http://localhost:9876"
registry.server.url=

# The name of this agent node. If left blank, will use "agent-{agentId}".
# Default: agent-{agentId}
registry.node.name=

# The operating system type of this agent. If left blank, will auto-detect.
# Possible values: Linux, Windows, Mac, Solaris, Other
# Default: auto-detected
registry.os.type=

# The application ID that this agent belongs to.
# Default: null
registry.app.id=

# Additional remarks or description for this agent.
# Default: null
registry.remark=

# The interval in seconds between heartbeat messages sent to the registry server.
# Default: 30 (30 seconds)
registry.heartbeat.interval.seconds=

# Whether to automatically register with the registry server on startup.
# Default: true
registry.auto.register=

# Whether to automatically send heartbeat messages to the registry server.
# Default: true
registry.auto.heartbeat=

# Number of boss threads for Netty server. Boss threads accept incoming connections.
# Default: 1
server.boss.threads=

# Number of worker threads for the Netty server. Worker threads handle I/O operations.
# Default: 0 (uses 2 * CPU cores)
server.worker.threads=

# Executor Configuration
# ======================

# Size of the thread pool for executing tasks.
# Default: 10
executor.thread.pool.size=

# Default timeout for executor tasks in seconds.
# Default: 30
executor.default.timeout.seconds=

# Maximum timeout for executor tasks in seconds.
# Default: 3600
executor.max.timeout.seconds=

# Connection Configuration
# ========================

# Idle timeout for connections in seconds. Connections idle longer than this will be closed.
# Default: 60
connection.idle.timeout.seconds=

# Maximum content length for HTTP requests in bytes.
# Default: 8 * 1024 * 1024 (8MB)
connection.max.content.length=

# File Operation Configuration
# ============================

# Base directory for file operations. All file paths are relative to this directory unless file.allow.outside.base is true.
# Default: /tmp/my-panel/admin/data/
file.base.directory=/tmp/my-panel/admin/data/

# Whether to allow file operations outside the base directory.
# Default: true
file.allow.outside.base=

# Maximum file size allowed for upload/download in bytes.
# Default: 107374182400 (100GB)
file.max.size=

# Chunk size for file transfer operations in bytes. Files are split into chunks of this size.
# Default: 5 * 1024 * 1024 (5MB)
file.chunk.size.bytes=

# Upload session timeout in minutes. Upload sessions inactive longer than this will be terminated.
# Default: 60
upload.session.timeout.minutes=

# Maximum upload rate in KB per second. 0 means no rate limiting.
# Default: 0 (no limit)
upload.max.rate.kb.per.second=

# Upload Client Configuration
# ===========================

# Number of concurrent uploads.
# Default: 4
upload.concurrent.uploads=

# Maximum queue depth for upload tasks.
# Default: 500
upload.max.queue.depth=

# Number of worker threads for processing upload tasks.
# Default: 4
upload.worker.count=

# Maximum number of retries for failed uploads.
# Default: 3
upload.max.retries=

# Delay between retry attempts in milliseconds.
# Default: 2000
upload.retry.delay.ms=

# Connection timeout for upload requests in seconds.
# Default: 10
upload.connect.timeout.seconds=

# Request timeout for upload operations in seconds.
# Default: 60
upload.request.timeout.seconds=

# Download Client Configuration
# =============================

# Number of concurrent downloads.
# Default: 4
download.concurrent.downloads=

# Maximum queue depth for download tasks.
# Default: 500
download.max.queue.depth=

# Number of worker threads for processing download tasks.
# Default: 4
download.worker.count=

# Maximum number of retries for failed downloads.
# Default: 3
download.max.retries=

# Delay between retry attempts in milliseconds.
# Default: 2000
download.retry.delay.ms=

# Connection timeout for download requests in seconds.
# Default: 10
download.connect.timeout.seconds=

# Request timeout for download operations in seconds.
# Default: 60
download.request.timeout.seconds=

# Maximum download rate in KB per second. 0 means no rate limiting.
# Default: 0 (no limit)
download.max.rate.kb.per.second=

# Transfer Metadata Configuration
# =================================

# Directory for storing upload task metadata files (for resumable uploads).
# This directory stores JSON metadata files that enable resume capability after restart.
# Default: /tmp/my-panel/admin/data/transfers/uploadSendingQueue
upload.sending.queue.dir=

# Directory for storing download task metadata files (for resumable downloads).
# This directory stores JSON metadata files that enable resume capability after restart.
# Default: /tmp/my-panel/admin/data/transfers/downloadSendingQueue
download.sending.queue.dir=

# Directory for archiving successfully completed upload task metadata files.
# Default: /tmp/my-panel/admin/data/transfers/uploadSuccessQueue
upload.success.queue.dir=

# Directory for storing progress fallback events when Proxy is unreachable.
# Default: /tmp/my-panel/admin/data/transfers/progress-fallback
progress.fallback.dir=