server {
    listen       80;
    server_name  _;

    # 前端静态资源根目录(dist 构建产物挂载到此目录)
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩,减小 JS bundle 传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 静态资源强缓存(带 hash 文件名,可长期缓存)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存,确保发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理到 my-panel-admin 容器(去除 /api 前缀)
    location /api/ {
        proxy_pass http://admin:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Spring Boot Admin 监控台
    location /admin/ {
        proxy_pass http://admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Druid 监控台
    location /druid/ {
        proxy_pass http://admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /swagger-ui {
        proxy_pass http://admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OpenAPI 文档
    location /v3 {
        proxy_pass http://admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Actuator 端点反向代理(健康检查、指标)
    location /actuator/ {
        proxy_pass http://admin:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA 路由回退:未命中的路径统一交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
