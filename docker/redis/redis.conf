# Redis 配置文件
# 端口(与 docker-compose 端口映射保持一致)
port 7379

# 绑定地址(允许所有来源连接)
bind 0.0.0.0

# 保护模式关闭(容器内不需要)
protected-mode no

# 持久化: AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 持久化: RDB
save 900 1
save 300 10
save 60 10000

# 最大内存
maxmemory 512mb
maxmemory-policy allkeys-lru

# 超时设置
timeout 300
tcp-keepalive 60

# 日志级别
loglevel notice

# 数据库数量
databases 16
