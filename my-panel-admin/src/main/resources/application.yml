# 项目相关配置
app:
  # 名称
  name: My-Panel
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/uploadPath，Linux配置 /home/uploadPath）
  profile: /tmp/my-panel/admin/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 运行模式: cluster (redis) / standalone (memory)
  mode: standalone
  # 上传路径
  importPath: ${app.profile}/import
  # 下载路径
  downloadPath: ${app.profile}/download
  # 头像上传路径
  avatarPath: ${app.profile}/avatar
  # 上传路径
  uploadPath: ${app.profile}/upload

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8888
  port: 8888
  # Nginx 监听端口 (脚本将自动读取并配置 Nginx)
  nginx-port: 9999
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    # 最大连接数（仍然有意义，限制并发连接数）
    max-connections: 10000
    # 虚拟线程模式下，线程数配置意义降低，但仍可设置参考值
    # threads.max: 200
    # 保持连接超时（毫秒）
    keep-alive-timeout: 60000


# 日志配置
logging:
  file:
    path: /tmp/my-panel/admin/logs/admin
  level:
    com.cq.panel.admin.server: debug
    org.springframework: warn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.cq.panel.admin.server.web.controller

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 激活 profile: 根据 app.mode 自动选择 (standalone 或 cluster)
  profiles:
    active: ${app.mode}
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    check-template-location: false
  sql:
    init:
      schema-locations: classpath:sql/schema.sql,classpath:sql/quartz.sql
      data-locations: classpath:sql/data.sql
      mode: always
      encoding: UTF-8

  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  # 开启虚拟线程
  threads:
    virtual:
      enabled: true
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  boot:
    admin:
      client:
        url: http://localhost:${server.port}/admin/server
        instance:
          service-base-url: http://localhost:${server.port}
      context-path: /admin/server

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.cq.panel.admin.server.repository.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath:mapper/**/*.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml


# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
    logfile:
      enabled: true
  info:
    env:
      enabled: true
