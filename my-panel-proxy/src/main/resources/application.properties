server.port=${SERVER_PORT:9876}
spring.config.import=optional:${ROOT_DIR:/tmp/my-panel/admin}/config/common.properties

#spring.datasource.url=jdbc:h2:file:${ROOT_DIR:/tmp/my-panel/admin}/data/h2.db;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.datasource.url=${common.datasource.url:jdbc:mysql://172.19.200.130:3306/my-panel?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&autoReconnect=true&serverTimezone=Asia/Shanghai}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${common.datasource.username:root}
spring.datasource.password=${common.datasource.password:123456}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

proxy.cache.maximum-size=10000
proxy.cache.expire-after-write-seconds=300
proxy.registry.heartbeat-timeout-seconds=60
proxy.registry.offline-scan-interval-seconds=10
proxy.registry.heartbeat-interval-seconds=10
proxy.registry.zone=shanghai
proxy.registry.port-range-min=9876
proxy.registry.port-range-max=9885
proxy.registry.address=${PROXY_REGISTRY_ADDRESS}
proxy.registry.port=${PROXY_REGISTRY_PORT}

# Batch event sync
batch.sync.poll-interval-seconds=3

logging.config=classpath:logback-spring.xml
logging.file.path=${ROOT_DIR:/tmp/my-panel/admin}/logs/proxy

# Spring virtual thread (Spring Boot 3.2+ / Spring Framework 6+)
spring.threads.virtual.enabled=true
spring.application.name=my-panel-proxy

# Tomcat configuration
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.keep-alive-timeout=60000
