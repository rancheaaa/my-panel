spring.datasource.url=jdbc:mysql://192.168.0.201:3306/my-panel?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=true

proxy.cache.maximum-size=10000
proxy.cache.expire-after-write-seconds=300
proxy.registry.heartbeat-timeout-seconds=60
proxy.registry.offline-scan-interval-seconds=10
proxy.registry.heartbeat-interval-seconds=10
proxy.registry.zone=shanghai
proxy.registry.port-range-min=9876
proxy.registry.port-range-max=9885

logging.config=classpath:logback-spring.xml